aid: swoogo
url: https://raw.githubusercontent.com/api-evangelist/swoogo/refs/heads/main/apis.yml
name: Swoogo
kind: company
description: Swoogo is an event management and event registration platform for building
  event websites, registration forms, agendas, and badges across in-person, virtual,
  and hybrid events. Swoogo exposes a documented public REST API at
  https://api.swoogo.com/api/v1 secured with OAuth2 client-credentials (bearer tokens
  that expire every 30 minutes). The API covers events, registrants, sessions,
  speakers, sponsors, tracks, packages, discount codes, transactions, contacts
  (CRM), call-for-speakers submissions, invitation lists, and webhooks - roughly
  140 endpoints. Access requires a paid Swoogo subscription; API credentials are
  issued from My Profile > API Credentials in the Swoogo app.
