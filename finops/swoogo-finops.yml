description: >-
  FinOps view of Swoogo spend. Swoogo is billed as an annual, team-based (per-user)
  SaaS subscription rather than on API or event volume - every plan includes
  unlimited events and unlimited registrations, so the cost driver is the number
  of team seats and the plan tier (Professional through Enterprise), not metered
  consumption. The REST API is included with the subscription at no separate fee;
  its only "budget" is the credit-based rate limit (2000 credits per 10 minutes),
  which caps throughput but does not add cost. There is no free tier or free
  trial. Implementation, onboarding, and third-party integrations can add
  one-time professional-services costs on top of the subscription.
notes: >-
  Swoogo does not publish itemized list pricing; subscription figures are
  third-party estimates and should be reconciled with Swoogo sales. Because
  billing is a flat annual subscription, FinOps attention is on seat/tier
  right-sizing and contract renewal rather than usage metering.
