meters:
- name: team_seats
  description: Number of Swoogo user seats on the subscription - the primary cost driver.
  unit: seats
  aggregation: max
  dimensions:
  - account
  - plan
- name: plan_tier
  description: Subscription tier (Professional, Growth/higher, Enterprise) that sets the seat price.
  unit: tier
  aggregation: max
  dimensions:
  - account
- name: api_credits
  description: Credit-based API rate-limit consumption (2000 credits per 10 minutes). Governs throughput, not billing.
  unit: credits
  aggregation: sum
  dimensions:
  - account
- name: professional_services
  description: One-time implementation, onboarding, training, and integration costs.
  unit: engagements
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track active team seats and plan tier against the annual contract; monitor API credit consumption to confirm the rate limit is sufficient without prompting a tier change.
- name: Allocation
  description: Map Swoogo seats to the teams/events that use them so the flat subscription can be charged back to the right cost centers.
- name: Optimization
  description: Right-size the number of seats and the plan tier to actual usage at renewal; batch API reads and prefer single-record fetches to stay within the credit window without upgrading.
- name: Accountability
  description: Assign an owner for the Swoogo contract and review seat counts and tier fit ahead of each annual renewal.
